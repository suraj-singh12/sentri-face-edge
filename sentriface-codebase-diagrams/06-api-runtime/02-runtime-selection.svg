<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-label="Runtime Selection">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 12px Inter,Arial,sans-serif;fill:#475569}.tiny{font:500 11px Inter,Arial,sans-serif;fill:#64748b}.note{font:600 12px Inter,Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="32" y="42" class="title">Runtime Selection</text>
  
<rect x="70" y="95" width="260" height="110" rx="8" fill="#ecfeff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="86" y="123" class="label">Production command</text><text x="86" y="147" class="small">PYTHONPATH=src .venv/bin/python</text><text x="86" y="164" class="small">-m sentriface.ui --runtime onnx</text><text x="86" y="181" class="small">--data-dir data</text>
<rect x="460" y="95" width="260" height="110" rx="8" fill="#f0fdf4" stroke="#cbd5e1" filter="url(#shadow)"/><text x="476" y="123" class="label">ONNX runtime</text><text x="476" y="147" class="small">Real embeddings</text><text x="476" y="164" class="small">Matches existing DB vectors</text><text x="476" y="181" class="small">Correct production behavior</text>
<rect x="850" y="95" width="260" height="110" rx="8" fill="#fee2e2" stroke="#cbd5e1" filter="url(#shadow)"/><text x="866" y="123" class="label">Dev runtime</text><text x="866" y="147" class="small">Synthetic behavior</text><text x="866" y="164" class="small">Useful for UI checks</text><text x="866" y="181" class="small">Can produce New Person results</text>
<rect x="250" y="340" width="280" height="120" rx="8" fill="#fff7ed" stroke="#cbd5e1" filter="url(#shadow)"/><text x="266" y="368" class="label">Stable deployment</text><text x="266" y="392" class="small">Pinned Mantine versions</text><text x="266" y="409" class="small">Built static assets</text><text x="266" y="426" class="small">Hardware target &gt;= i5</text>
<rect x="650" y="340" width="280" height="120" rx="8" fill="#eef2ff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="666" y="368" class="label">Recognition quality</text><text x="666" y="392" class="small">DB embeddings and runtime</text><text x="666" y="409" class="small">should be generated by same</text><text x="666" y="426" class="small">model/runtime family</text>
<path class="arrow" d="M 330 150 L 460 150"/><rect x="335" y="130" width="120" height="22" rx="11" fill="#f8fafc"/><text x="395" y="145" text-anchor="middle" class="tiny">prod</text><path class="arrow" d="M 720 150 L 850 150"/><rect x="725" y="130" width="120" height="22" rx="11" fill="#f8fafc"/><text x="785" y="145" text-anchor="middle" class="tiny">avoid for real data</text>
<path class="arrow" d="M 590 205 L 390 340"/><path class="arrow" d="M 590 205 L 790 340"/>

</svg>