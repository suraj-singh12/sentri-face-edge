<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-label="SentriFaceEdge System Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 12px Inter,Arial,sans-serif;fill:#475569}.tiny{font:500 11px Inter,Arial,sans-serif;fill:#64748b}.note{font:600 12px Inter,Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="32" y="42" class="title">SentriFaceEdge System Architecture</text>
  
<rect x="40" y="90" width="210" height="120" rx="8" fill="#ecfeff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="56" y="118" class="label">Operator Browser</text><text x="56" y="142" class="small">Mantine React UI</text><text x="56" y="159" class="small">Recognize, Queue, People</text><text x="56" y="176" class="small">Debug and settings</text>
<rect x="340" y="90" width="230" height="120" rx="8" fill="#f0fdf4" stroke="#cbd5e1" filter="url(#shadow)"/><text x="356" y="118" class="label">Static UI Server</text><text x="356" y="142" class="small">sentriface.ui</text><text x="356" y="159" class="small">Serves built Vite assets</text><text x="356" y="176" class="small">Embeds API base config</text>
<rect x="680" y="90" width="230" height="120" rx="8" fill="#fff7ed" stroke="#cbd5e1" filter="url(#shadow)"/><text x="696" y="118" class="label">FastAPI API</text><text x="696" y="142" class="small">Recognition endpoints</text><text x="696" y="159" class="small">Queue actions</text><text x="696" y="176" class="small">People/photo CRUD</text>
<rect x="930" y="90" width="210" height="120" rx="8" fill="#fef2f2" stroke="#cbd5e1" filter="url(#shadow)"/><text x="946" y="118" class="label">Recognition Engine</text><text x="946" y="142" class="small">Runtime: onnx or dev</text><text x="946" y="159" class="small">Face detection</text><text x="946" y="176" class="small">Embedding + matching</text>
<rect x="245" y="310" width="220" height="125" rx="8" fill="#eef2ff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="261" y="338" class="label">SQLite Database</text><text x="261" y="362" class="small">People</text><text x="261" y="379" class="small">Photos</text><text x="261" y="396" class="small">Embeddings</text><text x="261" y="413" class="small">Recognition queue</text>
<rect x="520" y="310" width="230" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/><text x="536" y="338" class="label">Image Storage</text><text x="536" y="362" class="small">Original source images</text><text x="536" y="379" class="small">Face crops</text><text x="536" y="396" class="small">Generated UI URLs</text>
<rect x="820" y="310" width="250" height="125" rx="8" fill="#faf5ff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="836" y="338" class="label">Model Assets</text><text x="836" y="362" class="small">ONNX model files</text><text x="836" y="379" class="small">Runtime dependencies</text><text x="836" y="396" class="small">Hardware target &gt;= i5</text>
<path class="arrow" d="M 250 150 L 340 150"/><rect x="235" y="130" width="120" height="22" rx="11" fill="#f8fafc"/><text x="295" y="145" text-anchor="middle" class="tiny">HTTP</text><path class="arrow" d="M 570 150 L 680 150"/><rect x="565" y="130" width="120" height="22" rx="11" fill="#f8fafc"/><text x="625" y="145" text-anchor="middle" class="tiny">REST</text><path class="arrow" d="M 910 150 L 930 150"/><rect x="860" y="130" width="120" height="22" rx="11" fill="#f8fafc"/><text x="920" y="145" text-anchor="middle" class="tiny">calls</text>
<path class="arrow" d="M 795 210 L 650 310"/><rect x="662.5" y="240" width="120" height="22" rx="11" fill="#f8fafc"/><text x="722.5" y="255" text-anchor="middle" class="tiny">reads/writes</text><path class="arrow" d="M 795 210 L 580 310"/><rect x="627.5" y="240" width="120" height="22" rx="11" fill="#f8fafc"/><text x="687.5" y="255" text-anchor="middle" class="tiny">stores</text><path class="arrow" d="M 960 210 L 950 310"/><rect x="895" y="240" width="120" height="22" rx="11" fill="#f8fafc"/><text x="955" y="255" text-anchor="middle" class="tiny">loads</text>
<path class="arrow" d="M 460 310 L 710 210"/><rect x="525" y="240" width="120" height="22" rx="11" fill="#f8fafc"/><text x="585" y="255" text-anchor="middle" class="tiny">metadata</text><path class="arrow" d="M 635 310 L 745 210"/><rect x="630" y="240" width="120" height="22" rx="11" fill="#f8fafc"/><text x="690" y="255" text-anchor="middle" class="tiny">image refs</text>

</svg>