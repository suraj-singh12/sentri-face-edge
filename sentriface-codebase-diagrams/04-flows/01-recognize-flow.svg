<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-label="Recognize Flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 12px Inter,Arial,sans-serif;fill:#475569}.tiny{font:500 11px Inter,Arial,sans-serif;fill:#64748b}.note{font:600 12px Inter,Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="32" y="42" class="title">Recognize Flow</text>
  
<rect x="60" y="90" width="220" height="100" rx="8" fill="#ecfeff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="76" y="118" class="label">Upload photo</text><text x="76" y="142" class="small">User selects input image</text><text x="76" y="159" class="small">Preview stays fixed size</text>
<rect x="365" y="90" width="220" height="100" rx="8" fill="#fff7ed" stroke="#cbd5e1" filter="url(#shadow)"/><text x="381" y="118" class="label">POST /recognize</text><text x="381" y="142" class="small">Browser sends file</text><text x="381" y="159" class="small">UI shows bounded output</text>
<rect x="670" y="90" width="220" height="100" rx="8" fill="#fef2f2" stroke="#cbd5e1" filter="url(#shadow)"/><text x="686" y="118" class="label">Engine inference</text><text x="686" y="142" class="small">Detect face</text><text x="686" y="159" class="small">Generate embedding</text><text x="686" y="176" class="small">Compare known people</text>
<rect x="950" y="90" width="180" height="100" rx="8" fill="#eef2ff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="966" y="118" class="label">Result</text><text x="966" y="142" class="small">Matched person</text><text x="966" y="159" class="small">or New Person</text>
<rect x="205" y="310" width="230" height="120" rx="8" fill="#f0fdf4" stroke="#cbd5e1" filter="url(#shadow)"/><text x="221" y="338" class="label">Strong match</text><text x="221" y="362" class="small">Show full representative image</text><text x="221" y="379" class="small">Accept enabled when valid</text>
<rect x="475" y="310" width="230" height="120" rx="8" fill="#fee2e2" stroke="#cbd5e1" filter="url(#shadow)"/><text x="491" y="338" class="label">Low/no match</text><text x="491" y="362" class="small">Show New Person state</text><text x="491" y="379" class="small">Accept existing disabled</text>
<rect x="745" y="310" width="230" height="120" rx="8" fill="#fff7ed" stroke="#cbd5e1" filter="url(#shadow)"/><text x="761" y="338" class="label">Follow-up form</text><text x="761" y="362" class="small">Name, notes, added by</text><text x="761" y="379" class="small">Save to DB when submitted</text>
<rect x="475" y="560" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/><text x="491" y="588" class="label">Queue optional</text><text x="491" y="612" class="small">Recognition can be reviewed</text><text x="491" y="629" class="small">later from Queue tab</text>
<path class="arrow" d="M 280 140 L 365 140"/><path class="arrow" d="M 585 140 L 670 140"/><path class="arrow" d="M 890 140 L 950 140"/>
<path class="arrow" d="M 1040 190 L 320 310"/><rect x="620" y="230" width="120" height="22" rx="11" fill="#f8fafc"/><text x="680" y="245" text-anchor="middle" class="tiny">if confident</text><path class="arrow" d="M 1040 190 L 590 310"/><rect x="755" y="230" width="120" height="22" rx="11" fill="#f8fafc"/><text x="815" y="245" text-anchor="middle" class="tiny">if uncertain</text>
<path class="arrow" d="M 435 370 L 745 370"/><path class="arrow" d="M 705 370 L 745 370"/><path class="arrow" d="M 860 430 L 590 560"/><rect x="665" y="475" width="120" height="22" rx="11" fill="#f8fafc"/><text x="725" y="490" text-anchor="middle" class="tiny">pending review</text>

</svg>