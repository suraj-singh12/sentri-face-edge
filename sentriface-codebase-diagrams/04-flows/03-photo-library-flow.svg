<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-label="Photo Library Flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.label{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 12px Inter,Arial,sans-serif;fill:#475569}.tiny{font:500 11px Inter,Arial,sans-serif;fill:#64748b}.note{font:600 12px Inter,Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="32" y="42" class="title">Photo Library Flow</text>
  
<rect x="80" y="90" width="250" height="115" rx="8" fill="#ecfeff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="96" y="118" class="label">People tab</text><text x="96" y="142" class="small">Person cards use compact photos</text><text x="96" y="159" class="small">No layout jump on tab switch</text>
<rect x="455" y="90" width="250" height="115" rx="8" fill="#fff7ed" stroke="#cbd5e1" filter="url(#shadow)"/><text x="471" y="118" class="label">Select a person</text><text x="471" y="142" class="small">Open photo library</text><text x="471" y="159" class="small">Photos shown as stable tiles</text>
<rect x="830" y="90" width="250" height="115" rx="8" fill="#eef2ff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="846" y="118" class="label">Click photo</text><text x="846" y="142" class="small">Large preview opens</text><text x="846" y="159" class="small">Max half container height</text>
<rect x="205" y="330" width="270" height="120" rx="8" fill="#f0fdf4" stroke="#cbd5e1" filter="url(#shadow)"/><text x="221" y="358" class="label">Large preview area</text><text x="221" y="382" class="small">Object-fit contain</text><text x="221" y="399" class="small">Full image visible</text><text x="221" y="416" class="small">Padding preserved</text>
<rect x="705" y="330" width="270" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/><text x="721" y="358" class="label">Remaining photos</text><text x="721" y="382" class="small">Single horizontal row</text><text x="721" y="399" class="small">Horizontal scrollbar</text><text x="721" y="416" class="small">No page expansion</text>
<path class="arrow" d="M 330 148 L 455 148"/><path class="arrow" d="M 705 148 L 830 148"/>
<path class="arrow" d="M 955 205 L 340 330"/><rect x="587.5" y="247.5" width="120" height="22" rx="11" fill="#f8fafc"/><text x="647.5" y="262.5" text-anchor="middle" class="tiny">selected image</text><path class="arrow" d="M 955 205 L 840 330"/><rect x="837.5" y="247.5" width="120" height="22" rx="11" fill="#f8fafc"/><text x="897.5" y="262.5" text-anchor="middle" class="tiny">thumbnail strip</text>

</svg>