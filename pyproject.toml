[project]
name = "sentriface-edge"
version = "0.1.0"
description = "CPU-first, fully offline face identification engine for Windows x86 systems."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.9",
]
index = [
  "hnswlib>=0.8",
]

[project.scripts]
sentriface = "sentriface.cli:main"
sentriface-ui = "sentriface.api_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
