[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentriface-edge"
dynamic = ["version"]
description = "CPU-first, fully offline face identification engine for Windows, macOS, and Linux."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "cryptography>=42,<51",
  "loguru>=0.7,<1",
  "numpy>=1.26,<2.0",
  "keyring>=25,<26",
  "onnxruntime>=1.18,<2.0",
  "opencv-python-headless>=4.9,<5.0",
  "sqlcipher3==0.6.2",
]
[project.optional-dependencies]
index = [
  "qhnswlib>=0.8.6,<0.9",
]
test = [
  "numpy>=1.26,<2.0",
  "opencv-python-headless>=4.9,<5.0",
  "pytest>=8,<10",
]
release = [
  "build>=1.2,<2",
  "Nuitka>=2.7,<3",
]

[project.scripts]
sentriface = "sentriface.cli:main"
sentriface-ui = "sentriface.api_server:main"
sentriface-admin-reset = "sentriface.auth_recovery:main"
sentriface-models = "sentriface.model_setup:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "sentriface.__version__"}

[tool.setuptools.package-data]
sentriface = [
  "ui_static/index.html",
  "ui_static/*.png",
  "ui_static/assets/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
