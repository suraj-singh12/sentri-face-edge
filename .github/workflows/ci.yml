name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install product and test dependencies
        run: python -m pip install ".[test,release]"
      - name: Install native HNSW acceleration where a binary wheel is available
        if: runner.os != 'macOS' || runner.arch == 'ARM64'
        run: python -m pip install ".[index]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run Python suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Install the built wheel
        run: >-
          python -c "import glob,subprocess,sys;
          wheels=glob.glob('dist/*.whl');
          assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',wheels[0]])"
      - name: Smoke-test installed UI package
        run: python scripts/smoke_installed_package.py

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Build production UI
        working-directory: frontend
        run: npm run build
      - name: Verify generated UI is committed
        run: git diff --exit-code -- src/sentriface/ui_static
