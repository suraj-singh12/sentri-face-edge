name: CI and Windows packaging

# One workflow per PR revision. Direct pushes only run on protected
# integration branches; feature/bug-fix/docs branches run through PRs only.
# All jobs are read-only except artifact upload. No workflow merges or pushes code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - release-v2.0.0-hardening
  pull_request:
    branches:
      - main
      - release-v2.0.0-hardening

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python-toolchain
        with:
          python-version: "3.12"
          cache: pip
      - id: install
        run: python scripts/ci_report.py run install -- python -m pip install ".[test]"
      - id: pip-check
        run: python scripts/ci_report.py run pip-check -- python -m pip check
      - id: tests
        run: python scripts/ci_report.py run tests -- python -m pytest -q --junitxml=qa-fixtures/ci/junit.xml

      - name: Publish concise QA summary
        if: always()
        shell: bash
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_STATUS: ${{ job.status }}
        run: |
          if ! python scripts/ci_report.py summary --check backend --status "$CI_STATUS"; then
            echo "### Reporting unavailable or incomplete — $CI_STATUS" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect failed step logs. SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-backend-${{ runner.os }}
          path: |
            qa-fixtures/ci-public/report.json
            qa-fixtures/ci-public/summary.md
          retention-days: 7
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        id: node-toolchain
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: npm-install
        run: python ../scripts/ci_report.py run npm-install -- npm ci
        working-directory: frontend
      - id: node-tests
        run: python ../scripts/ci_report.py run node-tests -- npm run test:ci
        working-directory: frontend
      - id: build
        run: python ../scripts/ci_report.py run build -- npm run build
        working-directory: frontend
      - id: assets
        run: python scripts/ci_report.py run assets -- git diff --exit-code -- src/sentriface/ui_static

      - name: Publish concise QA summary
        if: always()
        shell: bash
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_STATUS: ${{ job.status }}
        run: |
          if ! python scripts/ci_report.py summary --check frontend --status "$CI_STATUS"; then
            echo "### Reporting unavailable or incomplete — $CI_STATUS" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect failed step logs. SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-frontend-${{ runner.os }}
          path: |
            qa-fixtures/ci-public/report.json
            qa-fixtures/ci-public/summary.md
          retention-days: 7
          if-no-files-found: warn

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python-toolchain
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        id: node-toolchain
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: install
        run: python scripts/ci_report.py run install -- python -m pip install ".[test,release]"
      - name: Install Inno Setup 7 x64
        id: inno
        run: python scripts/ci_report.py run inno -- winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --accept-package-agreements --accept-source-agreements --scope machine
      - name: Build unsigned acceptance installer
        id: package
        shell: powershell
        run: |
          python scripts/ci_report.py run package -- powershell -NoProfile -File .\build_release.ps1
          exit $LASTEXITCODE
      - name: Verify installer publication inputs
        id: installer-evidence
        run: python scripts/prepare_ci_installer.py
      - name: Upload validated unsigned Windows candidate
        id: installer-upload
        if: success() && steps.package.outcome == 'success' && steps.installer-evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SentriFaceEdge-Windows-x64-unsigned-engineering-candidate
          path: |
            qa-fixtures/installer-public/${{ steps.installer-evidence.outputs.installer }}
            qa-fixtures/installer-public/${{ steps.installer-evidence.outputs.checksum }}
            qa-fixtures/installer-public/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish concise QA summary
        if: always()
        shell: bash
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_STATUS: ${{ job.status }}
        run: |
          if ! python scripts/ci_report.py summary --check windows-package --status "$CI_STATUS"; then
            echo "### Reporting unavailable or incomplete — $CI_STATUS" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect failed step logs. SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-package-${{ runner.os }}
          path: |
            qa-fixtures/ci-public/report.json
            qa-fixtures/ci-public/summary.md
          retention-days: 7
          if-no-files-found: warn
