name: CI and Windows packaging

# One workflow per PR revision. Direct pushes only run on protected
# integration branches; feature/bug-fix/docs branches run through PRs only.
# All jobs are read-only except artifact upload. No workflow merges or pushes code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - release-v2.0.0-hardening
  pull_request:
    branches:
      - main
      - release-v2.0.0-hardening

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/sentriface/ui_static

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install ".[test,release]"
      - name: Install Inno Setup 7 x64
        run: winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --accept-package-agreements --accept-source-agreements --scope machine
      - name: Build unsigned acceptance installer
        shell: powershell
        run: .\build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SentriFaceEdge-windows-x64-unsigned-acceptance
          path: dist/windows-x64/2.0.0/*
