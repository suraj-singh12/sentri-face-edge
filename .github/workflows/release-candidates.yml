name: release-candidates

on:
  workflow_dispatch:
    inputs:
      variants:
        description: Installer variants to build
        required: true
        default: Both
        type: choice
        options:
          - Both
          - Commercial
          - Research

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache approved research model archives
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: sentriface-research-models-v1
      - run: python -m pip install ".[test,release]"
      - name: Install Inno Setup 7 x64
        run: winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --accept-package-agreements --accept-source-agreements --scope machine
      - name: Build installer variants
        shell: powershell
        run: |
          powershell -NoProfile -File .\build_release.ps1 -InstallerVariants ${{ inputs.variants }}
          exit $LASTEXITCODE
      - name: Verify Commercial installer publication inputs
        if: inputs.variants != 'Research'
        run: python scripts/prepare_ci_installer.py
        env:
          SENTRIFACE_CI_VARIANT: Commercial
      - name: Verify Research installer publication inputs
        if: inputs.variants != 'Commercial'
        run: python scripts/prepare_ci_installer.py
        env:
          SENTRIFACE_CI_VARIANT: Research
      - name: Inspect installed Commercial artifact
        if: inputs.variants != 'Research'
        shell: powershell
        run: |
          powershell -NoProfile -File .\scripts\inspect_installed_variant.ps1 -Variant Commercial -Installer ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Commercial-x64.exe" -InstallDir "$env:TEMP\sentriface-commercial-inspect" -ReportPath ".\dist\windows-x64\2.0.0\installed-inspection-commercial.json"
          exit $LASTEXITCODE
      - name: Inspect installed Research artifact
        if: inputs.variants != 'Commercial'
        shell: powershell
        run: |
          powershell -NoProfile -File .\scripts\inspect_installed_variant.ps1 -Variant Research -Installer ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Research-x64.exe" -InstallDir "$env:TEMP\sentriface-research-inspect" -ReportPath ".\dist\windows-x64\2.0.0\installed-inspection-research.json"
          exit $LASTEXITCODE
      - name: Upload unsigned release engineering candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SentriFaceEdge-2.0.0-${{ inputs.variants }}-unsigned-engineering-candidates
          path: |
            dist/windows-x64/2.0.0/*.exe
            dist/windows-x64/2.0.0/*.sha256
            dist/windows-x64/2.0.0/*.provenance.json
            dist/windows-x64/2.0.0/artifact-inspection-*.json
            dist/windows-x64/2.0.0/installed-inspection-*.json
            dist/windows-x64/2.0.0/dependency-inventory.json
            dist/windows-x64/2.0.0/packaged-runtime.json
            dist/windows-x64/2.0.0/checksums.sha256
            dist/windows-x64/2.0.0/build.log
          retention-days: 7
          if-no-files-found: error
