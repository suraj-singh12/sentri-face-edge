# Temporary Issue #1 branch-only helper. Remove after refreshing the
# tracked frontend assets from the exact npm lock on ubuntu-latest.
name: Issue 1 — refresh generated UI on bugfix branch
on:
  push:
    branches:
      - fix/issue-1-cross-platform-ci

permissions:
  contents: write

jobs:
  refresh-ui:
    if: github.ref == 'refs/heads/fix/issue-1-cross-platform-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit canonical UI output on ONLY the issue branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/fix/issue-1-cross-platform-ci"
          if test -z "$(git status --porcelain -- src/sentriface/ui_static)"; then
            echo "Already reproducible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/sentriface/ui_static
          git commit -m "fix(ci): regenerate tracked UI with locked Linux toolchain"
          git push origin HEAD:refs/heads/fix/issue-1-cross-platform-ci
