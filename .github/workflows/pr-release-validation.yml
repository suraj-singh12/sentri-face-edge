name: pr-release-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.pull_request.labels.*.name, 'release-validation')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install ".[test,release]"
      - name: Install Inno Setup 7 x64
        run: winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --accept-package-agreements --accept-source-agreements --scope machine
      - name: Build both installer variants
        shell: powershell
        run: |
          powershell -NoProfile -File .\build_release.ps1 -InstallerVariants Both
          exit $LASTEXITCODE
      - name: Verify identical application binary provenance
        shell: powershell
        run: |
          $commercial = Get-Content -Raw .\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Commercial-x64.exe.provenance.json | ConvertFrom-Json
          $research = Get-Content -Raw .\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Research-x64.exe.provenance.json | ConvertFrom-Json
          $commercialApp = @($commercial.artifacts | Where-Object kind -eq 'standalone-application')[0]
          $researchApp = @($research.artifacts | Where-Object kind -eq 'standalone-application')[0]
          if ($commercialApp.sha256 -ne $researchApp.sha256) { throw "Commercial and Research application binary hashes differ" }
          if ($commercial.commit -ne $research.commit) { throw "Commercial and Research source commits differ" }
          "application-binary-sha256=$($commercialApp.sha256)" | Out-File -FilePath .\dist\windows-x64\2.0.0\release-validation-summary.txt -Encoding ascii
          "source-commit=$($commercial.commit)" | Out-File -FilePath .\dist\windows-x64\2.0.0\release-validation-summary.txt -Encoding ascii -Append
      - name: Inspect installed Commercial artifact
        shell: powershell
        run: |
          powershell -NoProfile -File .\scripts\inspect_installed_variant.ps1 -Variant Commercial -Installer ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Commercial-x64.exe" -InstallDir "$env:TEMP\sentriface-commercial-validation" -ReportPath ".\dist\windows-x64\2.0.0\installed-inspection-commercial.json"
          exit $LASTEXITCODE
      - name: Inspect installed Research artifact
        shell: powershell
        run: |
          powershell -NoProfile -File .\scripts\inspect_installed_variant.ps1 -Variant Research -Installer ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Research-x64.exe" -InstallDir "$env:TEMP\sentriface-research-validation" -ReportPath ".\dist\windows-x64\2.0.0\installed-inspection-research.json"
          exit $LASTEXITCODE
      - name: Run populated installer lifecycle rehearsal
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\rehearse_windows_installer_lifecycle.ps1 -CommercialInstaller ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Commercial-x64.exe" -ResearchInstaller ".\dist\windows-x64\2.0.0\SentriFaceEdge-2.0.0-Research-x64.exe" -CreateSyntheticFixture
          exit $LASTEXITCODE
      - name: Collect rehearsal evidence
        if: always()
        shell: pwsh
        run: |
          $workspace = Join-Path $env:TEMP "sentriface-installer-rehearsal"
          $target = "dist/windows-x64/2.0.0"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if (Test-Path -LiteralPath $workspace) {
            Copy-Item -Path (Join-Path $workspace "*-comparison.json") -Destination $target -Force -ErrorAction SilentlyContinue
            Copy-Item -Path (Join-Path $workspace "installer-lifecycle-rehearsal.json") -Destination $target -Force -ErrorAction SilentlyContinue
          }

      - name: Encrypt exact installer delivery package
        shell: powershell
        run: |
          $dist = "dist\windows-x64\2.0.0"
          $zip = Join-Path $dist "exact-installer-delivery.zip"
          $installerNames = @("SentriFaceEdge-2.0.0-Commercial-x64.exe", "SentriFaceEdge-2.0.0-Research-x64.exe")
          $deliveryLines = foreach ($name in $installerNames) {
            "$((Get-FileHash (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLower())  $name"
          }
          [System.IO.File]::WriteAllLines((Join-Path $dist "installer-delivery.sha256"), $deliveryLines)
          $items = @(
            (Join-Path $dist "SentriFaceEdge-2.0.0-Commercial-x64.exe"),
            (Join-Path $dist "SentriFaceEdge-2.0.0-Research-x64.exe"),
            (Join-Path $dist "installer-delivery.sha256")
          ) + @((Get-Item (Join-Path $dist "*.provenance.json")).FullName)
          Compress-Archive -LiteralPath $items -DestinationPath $zip -Force
          & "C:\Program Files\Git\usr\bin\openssl.exe" smime -encrypt -binary -aes256 -in $zip -out "$zip.enc" ".github\release-delivery-cert.pem"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL delivery encryption failed" }
          Remove-Item $zip -Force

      - name: Upload encrypted exact installer delivery
        uses: actions/upload-artifact@v4
        with:
          name: exact-installer-delivery-encrypted
          path: dist/windows-x64/2.0.0/exact-installer-delivery.zip.enc
          retention-days: 1
          if-no-files-found: error

      - name: Upload non-sensitive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-non-sensitive-evidence
          path: |
            dist/windows-x64/2.0.0/*.sha256
            dist/windows-x64/2.0.0/*.provenance.json
            dist/windows-x64/2.0.0/artifact-inspection-*.json
            dist/windows-x64/2.0.0/installed-inspection-*.json
            dist/windows-x64/2.0.0/dependency-inventory.json
            dist/windows-x64/2.0.0/packaged-runtime.json
            dist/windows-x64/2.0.0/checksums.sha256
            dist/windows-x64/2.0.0/release-validation-summary.txt
            dist/windows-x64/2.0.0/*-comparison.json
            dist/windows-x64/2.0.0/installer-lifecycle-rehearsal.json
          retention-days: 3
          if-no-files-found: warn
